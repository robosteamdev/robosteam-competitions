{% extends "contest/base_site.html" %}
{% load static %}
{% block title %}<title>Password reset complete — RoboSTEAM Academy</title>{% endblock %}
{% block page_content %}
<div style="background:#0f1728;min-height:calc(100vh - 200px);padding:2rem 1rem;">
  <div class="login-card">
    <div class="text-center">
      <img src="{% static 'contest/img/robostem-academy.png' %}" alt="RoboSTEAM Academy" height="52" class="mb-3">
      <h4 style="font-family:'Poppins',sans-serif;font-weight:700;color:#1a2332;">Password changed</h4>
      <p style="font-size:14px;color:#5a6b7a;">Your password has been updated. You can now sign in with your new password.</p>
      <a href="{% url 'login' %}" class="btn btn-primary-teal w-100 py-2 mt-2">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
